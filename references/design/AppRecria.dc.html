<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>App Simular recria</title>
<script src="./support.js"></script>
<script src="./calc.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Geist:wght@400..700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Geist',system-ui,sans-serif;color:#10231B;font-variant-numeric:tabular-nums}
.disp{font-family:'Bricolage Grotesque','Geist',sans-serif}
a{color:inherit;text-decoration:none}
.th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:#5F7367}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:48px;justify-content:center;font-size:11.5px;font-weight:600;color:#5F7367}
.tab .pill{width:56px;height:30px;border-radius:15px;display:flex;align-items:center;justify-content:center}
.tab.on{color:#134733}.tab.on .pill{background:#CFE9D2}
.fld{display:flex;align-items:center;gap:6px;border:1px solid #CFE2CE;border-radius:12px;background:#fff;min-height:48px;padding:0 12px;box-sizing:border-box}
.fld:focus-within{outline:2px solid #1F7A4F;outline-offset:1px;border-color:#1F7A4F}
.fld input{border:0;outline:0;flex:1;min-width:0;background:transparent;font:500 16px 'Geist',sans-serif;color:#10231B;font-variant-numeric:tabular-nums;padding:0;height:46px}
.fld span{color:#5F7367;font-size:12.5px;font-weight:500;white-space:nowrap}
.lbl{display:flex;flex-direction:column;gap:6px;font-size:12.5px;font-weight:600;min-width:0}
</style>
</helmet>

<div style="width:390px;height:844px;box-sizing:border-box;background:#F2F7F1;display:flex;flex-direction:column;overflow:hidden">

  <header style="flex:0 0 auto;background:#0D3324;color:#fff;padding:18px 16px 16px;position:relative;overflow:hidden">
    <div style="position:absolute;inset:0;background:repeating-linear-gradient(100deg,rgba(181,224,90,.08) 0 2px,transparent 2px 22px)"></div>
    <div style="position:relative">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <h1 class="disp" style="margin:0;font-size:24px;letter-spacing:-.03em;font-weight:700">Simular recria</h1>
        <span style="font-size:12px;font-weight:600;color:#B5E05A;border:1px solid rgba(181,224,90,.4);border-radius:999px;padding:4px 10px">Ano 1 · 11/07/2026</span>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-top:12px;gap:12px" aria-live="polite">
        <div><div class="th" style="color:#B5E05A">Faturamento líquido</div><div class="disp" style="font-size:34px;font-weight:700;letter-spacing:-.035em;color:{{liqColor}}">{{liquido}}</div></div>
        <div style="text-align:right"><div class="th" style="color:#9DBFA3">Por hectare</div><div style="font-size:16px;font-weight:700">{{liqHa}}</div></div>
      </div>
    </div>
  </header>

  <div style="flex:1;overflow-y:auto;padding:16px 16px 20px;display:flex;flex-direction:column;gap:14px">
    <sc-for list="{{grupos}}" as="g" hint-placeholder-count="4">
      <section style="border-radius:20px;background:#fff;border:1px solid #DCE7DC;padding:16px 16px 18px;display:flex;flex-direction:column;gap:12px">
        <h2 class="disp" style="margin:0;font-size:18px;letter-spacing:-.02em">{{g.titulo}}</h2>
        <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px">
          <sc-for list="{{g.campos}}" as="c" hint-placeholder-count="4">
            <label class="lbl">{{c.label}}
              <div class="fld"><span>{{c.prefix}}</span><input inputmode="decimal" value="{{c.value}}" onChange="{{c.onChange}}"><span>{{c.suffix}}</span></div>
            </label>
          </sc-for>
        </div>
      </section>
    </sc-for>
    <a href="AppResultado.dc.html" style="display:flex;align-items:center;justify-content:center;min-height:52px;border-radius:14px;background:#1F7A4F;color:#fff;font-weight:700;font-size:16px">Ver resultado completo</a>
  </div>

  <nav aria-label="Principal" style="flex:0 0 auto;display:flex;border-top:1px solid #DCE7DC;background:#fff;padding:8px 8px 22px">
    <a class="tab" href="AppPainel.dc.html"><span class="pill"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg></span>Painel</a>
    <a class="tab" href="AppCompraVenda.dc.html"><span class="pill"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 7h13M16 3l4 4-4 4M17 17H4M8 13l-4 4 4 4"/></svg></span>Negócios</a>
    <a class="tab on" href="AppRecria.dc.html" aria-current="page"><span class="pill"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 12h.01M12 12h.01M16 12h.01M8 16h.01M12 16h.01M16 16h.01"/></svg></span>Recria</a>
      <a class="tab" href="AppAjustes.dc.html"><span class="pill"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg></span>Conta</a>
  </nav>
</div>
</x-dc>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { v: this.defaults() }; }
  defaults() {
    return { area: '102', dias: '270', investimento: '122.534,80', rsCabCompra: '2.050', pesoIni: '188', pesoFin: '420', precoVenda: '325',
      consumoPct: '0,3', precoSuplKg: '2,00', rendCarcaca: '52', imposto: '1,5', sanidadeCabMes: '2,50', funcionario: '9.000', frete: '3.000' };
  }
  renderVals() {
    const v = this.state.v, N = OGado.num, B = OGado.brl;
    const o = OGado.recria({ area: v.area, dias: v.dias, investimento: v.investimento, rsCabCompra: v.rsCabCompra, pesoIni: v.pesoIni, pesoFin: v.pesoFin,
      precoVenda: v.precoVenda, consumoPct: N(v.consumoPct) / 100, precoSuplKg: v.precoSuplKg, rendCarcaca: N(v.rendCarcaca) / 100, imposto: N(v.imposto) / 100,
      sanidadeCabMes: v.sanidadeCabMes, funcionario: v.funcionario, frete: v.frete });
    const fld = (key, label, prefix, suffix) => ({ label, prefix: prefix || '', suffix: suffix || '', value: v[key],
      onChange: (e) => { const val = e.target.value; this.setState((s) => ({ v: Object.assign({}, s.v, { [key]: val }) })); } });
    const S = (n) => (n < 0 ? '−' : '') + B(Math.abs(n));
    return {
      liquido: S(o.faturamentoLiquido), liqColor: o.faturamentoLiquido < 0 ? '#FF9C8A' : '#B5E05A', liqHa: S(o.liquidoHa),
      grupos: [
        { titulo: 'Lote e área', campos: [fld('area', 'Área pastável', '', 'ha'), fld('dias', 'Dias de recria', '', 'dias'), fld('investimento', 'Investimento', 'R$'), fld('rsCabCompra', 'R$/cab. compra', 'R$'),
          fld('pesoIni', 'Peso inicial', '', 'kg'), fld('pesoFin', 'Peso final', '', 'kg'), fld('precoVenda', 'Preço de venda', 'R$', '/@')] },
        { titulo: 'Suplemento', campos: [fld('consumoPct', 'Consumo (% peso)', '', '%'), fld('precoSuplKg', 'Proteinado', 'R$', '/kg')] },
        { titulo: 'Imposto e sanidade', campos: [fld('rendCarcaca', 'Rend. carcaça', '', '%'), fld('imposto', 'Imposto', '', '%'), fld('sanidadeCabMes', 'Sanidade', 'R$', '/cab./mês')] },
        { titulo: 'Outros custos', campos: [fld('funcionario', 'Funcionário', 'R$'), fld('frete', 'Frete', 'R$')] }
      ]
    };
  }
}
</script>
</body>
</html>
