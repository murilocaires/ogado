<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>App Compra e Venda</title>
<script src="./support.js"></script>
<script src="./calc.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Geist:wght@400..700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Geist',system-ui,sans-serif;color:#10231B;font-variant-numeric:tabular-nums}
.disp{font-family:'Bricolage Grotesque','Geist',sans-serif}
a{color:inherit;text-decoration:none}
.th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:#5F7367}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:48px;justify-content:center;font-size:11.5px;font-weight:600;color:#5F7367}
.tab .pill{width:56px;height:30px;border-radius:15px;display:flex;align-items:center;justify-content:center}
.tab.on{color:#134733}.tab.on .pill{background:#CFE9D2}
.seg{display:flex;border-radius:14px;padding:4px;background:#E4EFE3}
.seg button{flex:1;border:0;border-radius:11px;min-height:44px;font:600 14.5px 'Geist',sans-serif;cursor:pointer;color:#4A5F55;background:transparent}
.calc{border-radius:12px;background:#EAF3E9;padding:10px 12px}
</style>
</helmet>

<div style="width:390px;height:844px;box-sizing:border-box;background:#F2F7F1;display:flex;flex-direction:column;overflow:hidden;position:relative">

  <div style="flex:1;overflow-y:auto;padding:20px 16px 96px;display:flex;flex-direction:column;gap:14px">
    <header>
      <h1 class="disp" style="margin:0;font-size:30px;line-height:1.05;letter-spacing:-.03em;font-weight:700">Compra e Venda</h1>
    </header>

    <div style="display:flex;gap:10px">
      <div style="flex:1;border-radius:16px;background:#0D3324;color:#fff;padding:14px 16px">
        <div class="th" style="color:#B5E05A">Saldo</div>
        <div class="disp" style="font-size:22px;font-weight:700;letter-spacing:-.02em;margin-top:2px;color:{{saldoColor}}">{{saldo}}</div>
      </div>
    </div>

    <div class="seg" role="tablist" aria-label="Tipo de lote">
      <button role="tab" aria-selected="{{isCompra}}" style="{{segC}}" onClick="{{showCompras}}">Compras</button>
      <button role="tab" aria-selected="{{isVenda}}" style="{{segV}}" onClick="{{showVendas}}">Vendas</button>
    </div>

    <div style="display:flex;justify-content:space-between;align-items:baseline;padding:0 4px">
      <span style="font-size:13px;color:#4A5F55">{{resumo}}</span>
      <span style="font-size:15px;font-weight:700">{{totalAba}}</span>
    </div>

    <sc-for list="{{lotes}}" as="l" hint-placeholder-count="2">
      <article style="border-radius:20px;background:#fff;border:1px solid #DCE7DC;padding:16px 18px;display:flex;flex-direction:column;gap:12px">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">
          <div>
            <div style="font-size:12px;color:#5F7367;font-weight:600">Lote {{l.n}} · {{l.data}}</div>
            <div class="disp" style="font-size:20px;font-weight:700;letter-spacing:-.02em;margin-top:2px">{{l.categoria}}</div>
          </div>
          <div style="text-align:right">
            <div class="th">Total</div>
            <div class="disp" style="font-size:20px;font-weight:700;letter-spacing:-.02em">{{l.total}}</div>
          </div>
        </div>
        <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px">
          <div class="calc"><div class="th">Cabeças</div><div style="font-size:15px;font-weight:700;margin-top:2px">{{l.qtd}}</div></div>
          <div class="calc"><div class="th">Peso</div><div style="font-size:15px;font-weight:700;margin-top:2px">{{l.arr}} @</div></div>
          <div class="calc"><div class="th">R$/@</div><div style="font-size:15px;font-weight:700;margin-top:2px">{{l.preco}}</div></div>
        </div>
        <div style="font-size:13px;color:#4A5F55;display:flex;justify-content:space-between"><span>{{l.kg}} kg</span><span>{{l.porCab}} por cabeça</span></div>
      </article>
    </sc-for>
  </div>

  <a href="AppNovoLote.dc.html" aria-label="Novo lote" style="position:absolute;right:16px;bottom:100px;height:56px;border-radius:28px;background:#1F7A4F;color:#fff;display:flex;align-items:center;gap:8px;padding:0 22px 0 18px;font-weight:700;font-size:15px;box-shadow:0 8px 20px rgba(13,51,36,.28)">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Novo lote
  </a>

  <nav aria-label="Principal" style="position:absolute;left:0;right:0;bottom:0;display:flex;border-top:1px solid #DCE7DC;background:#fff;padding:8px 8px 22px">
    <a class="tab" href="AppPainel.dc.html"><span class="pill"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg></span>Painel</a>
    <a class="tab on" href="AppCompraVenda.dc.html" aria-current="page"><span class="pill"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 7h13M16 3l4 4-4 4M17 17H4M8 13l-4 4 4 4"/></svg></span>Negócios</a>
    <a class="tab" href="AppRecria.dc.html"><span class="pill"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 12h.01M12 12h.01M16 12h.01M8 16h.01M12 16h.01M16 16h.01"/></svg></span>Recria</a>
      <a class="tab" href="AppAjustes.dc.html"><span class="pill"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg></span>Conta</a>
  </nav>
</div>
</x-dc>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { aba: 'compras' }; }
  renderVals() {
    const F = OGado.fmt, B = OGado.brl, s = OGado.sample.compraVenda;
    const cv = OGado.compraVenda(s);
    const aba = this.state.aba, isC = aba === 'compras';
    const lista = isC ? s.compras : s.vendas, calc = isC ? cv.compras : cv.vendas;
    const dt = (iso) => (iso ? iso.split('-').reverse().join('/') : 'sem data');
    const lotes = lista.map((o, i) => ({ n: i + 1, data: dt(o.data), categoria: o.categoria.charAt(0) + o.categoria.slice(1).toLowerCase(),
      total: B(calc[i].total), qtd: F(calc[i].qtd, 0), arr: F(calc[i].arrobas, 2), preco: B(calc[i].preco, 0), kg: F(calc[i].kg, 0), porCab: B(calc[i].porCab) }));
    const on = 'background:#fff;color:#10231B;box-shadow:0 1px 3px rgba(13,51,36,.15)', off = 'background:transparent;color:#4A5F55';
    return {
      saldo: (cv.saldo < 0 ? '−' : '+') + B(Math.abs(cv.saldo)), saldoColor: cv.saldo < 0 ? '#FF9C8A' : '#B5E05A',
      isCompra: isC, isVenda: !isC, segC: isC ? on : off, segV: isC ? off : on,
      resumo: isC ? F(cv.cabCompra, 0) + ' cab. · ' + F(cv.arrCompra, 2) + ' @' : F(cv.cabVenda, 0) + ' cab. · ' + F(cv.arrVenda, 2) + ' @',
      totalAba: B(isC ? cv.totalCompras : cv.totalVendas), lotes,
      showCompras: () => this.setState({ aba: 'compras' }), showVendas: () => this.setState({ aba: 'vendas' })
    };
  }
}
</script>
</body>
</html>
