<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>App Resultado da recria</title>
<script src="./support.js"></script>
<script src="./calc.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Geist:wght@400..700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Geist',system-ui,sans-serif;color:#10231B;font-variant-numeric:tabular-nums}
.disp{font-family:'Bricolage Grotesque','Geist',sans-serif}
a{color:inherit;text-decoration:none}
.th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:#5F7367}
.card{border-radius:20px;background:#fff;border:1px solid #DCE7DC;padding:16px 18px;box-sizing:border-box}
</style>
</helmet>

<div style="width:390px;height:844px;box-sizing:border-box;background:#F2F7F1;display:flex;flex-direction:column;overflow:hidden">

  <div style="flex:1;overflow-y:auto;padding:12px 16px 24px;display:flex;flex-direction:column;gap:14px">
    <header style="display:flex;align-items:center;gap:6px">
      <a href="AppRecria.dc.html" aria-label="Voltar" style="width:44px;height:44px;margin-left:-8px;display:flex;align-items:center;justify-content:center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#10231B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
      <h1 class="disp" style="margin:0;font-size:24px;letter-spacing:-.03em;font-weight:700">Resultado da recria</h1>
    </header>

    <section aria-label="Resultado" style="border-radius:24px;background:#0D3324;color:#fff;padding:22px;position:relative;overflow:hidden">
      <div style="position:absolute;inset:0;background:repeating-linear-gradient(100deg,rgba(181,224,90,.08) 0 2px,transparent 2px 22px)"></div>
      <div style="position:absolute;right:-70px;top:-90px;width:230px;height:230px;border-radius:50%;border:2px solid rgba(181,224,90,.22)"></div>
      <div style="position:relative">
        <div class="th" style="color:#B5E05A">Faturamento líquido</div>
        <div class="disp" style="font-size:40px;font-weight:700;letter-spacing:-.035em;margin-top:6px;color:#B5E05A">{{liquido}}</div>
        <div style="font-size:13.5px;color:#CFE2CE;margin-top:4px">{{nota}}</div>
        <div style="display:flex;gap:10px;margin-top:16px">
          <div style="flex:1;border-radius:12px;background:rgba(255,255,255,.09);padding:10px 12px"><div class="th" style="color:#9DBFA3">Por mês</div><div style="font-size:15px;font-weight:700;margin-top:2px">{{liqMes}}</div></div>
          <div style="flex:1;border-radius:12px;background:rgba(255,255,255,.09);padding:10px 12px"><div class="th" style="color:#9DBFA3">Por hectare</div><div style="font-size:15px;font-weight:700;margin-top:2px">{{liqHa}}</div></div>
        </div>
      </div>
    </section>

    <section class="card" aria-label="Custo operacional">
      <div style="display:flex;justify-content:space-between;align-items:baseline"><h2 class="disp" style="margin:0;font-size:18px;letter-spacing:-.02em">Custo operacional</h2><span class="disp" style="font-size:18px;font-weight:700">{{custoTotal}}</span></div>
      <div role="img" aria-label="Composição do custo operacional" style="display:flex;height:14px;border-radius:7px;overflow:hidden;gap:2px;margin:12px 0 6px">
        <sc-for list="{{custos}}" as="s" hint-placeholder-count="5"><div style="{{s.barra}}"></div></sc-for>
      </div>
      <sc-for list="{{custos}}" as="s" hint-placeholder-count="5">
        <div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid #EAF3E9;font-size:14px">
          <span style="{{s.dot}}"></span><span style="flex:1;font-weight:500">{{s.nome}}</span><span style="color:#5F7367;font-size:12.5px">{{s.pct}}</span><span style="font-weight:700;min-width:92px;text-align:right">{{s.valor}}</span>
        </div>
      </sc-for>
    </section>

    <section class="card" aria-label="Do faturamento ao caixa">
      <h2 class="disp" style="margin:0 0 6px;font-size:18px;letter-spacing:-.02em">Do faturamento ao caixa</h2>
      <sc-for list="{{fech}}" as="l" hint-placeholder-count="5">
        <div style="{{l.style}}"><span style="flex:1">{{l.label}}</span><span style="font-weight:700">{{l.valor}}</span></div>
      </sc-for>
    </section>

    <section class="card" aria-label="Lote e lotação">
      <h2 class="disp" style="margin:0 0 10px;font-size:18px;letter-spacing:-.02em">Lote e lotação</h2>
      <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">
        <sc-for list="{{zoo}}" as="z" hint-placeholder-count="4">
          <div style="border-radius:12px;background:#F2F7F1;padding:10px 12px"><div class="th">{{z.label}}</div><div class="disp" style="font-size:20px;font-weight:700;letter-spacing:-.02em;margin-top:2px">{{z.valor}} <span style="font-size:12px;font-weight:500;color:#5F7367;font-family:'Geist',sans-serif">{{z.un}}</span></div></div>
        </sc-for>
      </div>
    </section>
  </div>
</div>
</x-dc>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const F = OGado.fmt, B = OGado.brl;
    const o = OGado.recria(OGado.sample.recria), i = o.inputs;
    const cores = { supl: '#0D3324', san: '#1F7A4F', imp: '#6BBF8C', frete: '#B5E05A', func: '#E8C45A' };
    const custos = o.custos.map((c) => ({ nome: c.nome, valor: B(c.valor), pct: F(c.valor / o.custoTotal * 100, 1) + '%',
      barra: 'flex:' + c.valor + ' 1 0;background:' + cores[c.id], dot: 'width:11px;height:11px;border-radius:4px;background:' + cores[c.id] }));
    const row = 'display:flex;align-items:center;gap:6px;padding:10px 0;border-top:1px solid #EAF3E9;font-size:14px';
    const tot = 'display:flex;align-items:center;gap:6px;padding:12px 12px;margin:4px 0;border-radius:12px;background:#EAF3E9;font-size:14.5px;font-weight:700';
    return {
      liquido: B(o.faturamentoLiquido), nota: 'Em ' + F(i.dias, 0) + ' dias · ' + F(o.cabecas, 1) + ' cabeças · ' + F(i.area, 0) + ' ha',
      liqMes: B(o.liquidoMes), liqHa: B(o.liquidoHa), custoTotal: B(o.custoTotal), custos,
      fech: [
        { label: 'Faturamento bruto', valor: B(o.faturamentoBruto), style: row },
        { label: '− Custo operacional', valor: B(o.custoTotal), style: row },
        { label: '− Investimento na compra', valor: B(i.investimento), style: row },
        { label: 'Faturamento líquido', valor: B(o.faturamentoLiquido), style: tot },
        { label: '+ Investimento devolvido', valor: B(i.investimento), style: row },
        { label: 'Total em caixa', valor: B(o.totalEmCaixa), style: tot }
      ],
      zoo: [
        { label: 'Lotação total', valor: F(o.lotacaoTotalUA, 1), un: 'UA' }, { label: 'Lotação final', valor: F(o.lotacaoFinal, 2), un: 'UA/ha' },
        { label: 'Arrobas na venda', valor: F(o.arrobasProduzidas, 1), un: '@' }, { label: 'Ganho diário', valor: F(o.gmdImplicito, 3), un: 'kg/dia' }
      ]
    };
  }
}
</script>
</body>
</html>
