<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>O Gado — Protótipo</title>
<meta name="theme-color" content="#0D3324">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%230D3324'/%3E%3Ccircle cx='32' cy='40' r='12' fill='none' stroke='%23B5E05A' stroke-width='7'/%3E%3Cpath d='M23.5 31.5C13 31 9 21 13 13' fill='none' stroke='%23B5E05A' stroke-width='6' stroke-linecap='round'/%3E%3Cpath d='M40.5 31.5C51 31 55 21 51 13' fill='none' stroke='%23B5E05A' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Geist:wght@400..700&display=swap" rel="stylesheet">
<style>
:root{
  --floresta:#0D3324; --folha:#1F7A4F; --folha-h:#17623F; --pasto:#B5E05A;
  --n50:#F2F7F1; --n100:#E4EFE3; --n200:#CFE2CE; --calc:#EAF3E9; --linha:#DCE7DC;
  --tinta:#10231B; --t2:#4A5F55; --t3:#5F7367; --barro:#B4412F; --barro-c:#FF9C8A; --palha:#E8C45A; --palha-bg:#FFF6DC;
  --disp:'Bricolage Grotesque','Geist',system-ui,sans-serif; --ui:'Geist',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--ui);color:var(--tinta);background:var(--n50);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
h1,h2,h3{font-family:var(--disp);letter-spacing:-.03em;margin:0}
.th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--t3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:2px solid var(--folha);outline-offset:2px}

/* shell */
#app{min-height:100vh}
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
aside{background:var(--floresta);color:#fff;padding:22px 16px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand b{font-family:var(--disp);font-size:24px;letter-spacing:-.03em}
.nav{display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;gap:12px;min-height:46px;padding:0 14px;border-radius:14px;color:#CFE2CE;font-weight:600;font-size:15px}
.nav a:hover{background:rgba(255,255,255,.07)}
.nav a.on{background:var(--pasto);color:var(--floresta)}
.side-foot{margin-top:auto;font-size:12.5px;color:#9DBFA3;line-height:1.5;padding:0 6px}
.side-foot .tagline{color:var(--pasto);font-family:var(--disp);font-size:15px;margin-bottom:6px}
main{padding:28px 36px 60px;max-width:1180px;width:100%}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.top h1{font-size:34px;line-height:1.05;font-weight:700}
.top p{margin:6px 0 0;color:var(--t2);font-size:15px}
.badge{font-size:12px;font-weight:700;border-radius:999px;padding:5px 11px;background:var(--palha-bg);color:#7A5B00;border:1px solid var(--palha)}
.bottom{display:none}

/* cards & grids */
.card{background:#fff;border:1px solid var(--linha);border-radius:20px;padding:20px 22px}
.card h2{font-size:19px;margin-bottom:14px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.hero{background:var(--floresta);color:#fff;border-radius:24px;padding:26px;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(100deg,rgba(181,224,90,.08) 0 2px,transparent 2px 22px)}
.hero:after{content:"";position:absolute;right:-70px;top:-90px;width:240px;height:240px;border-radius:50%;border:2px solid rgba(181,224,90,.22)}
.hero>*{position:relative;z-index:1}
.hero .th{color:var(--pasto)}
.big{font-family:var(--disp);font-weight:700;letter-spacing:-.035em;font-size:44px;line-height:1.05;margin-top:6px}
.pos{color:var(--pasto)}.neg{color:var(--barro-c)}
.mini{background:rgba(255,255,255,.09);border-radius:12px;padding:10px 14px}
.mini .th{color:#9DBFA3}.mini b{display:block;font-size:16px;margin-top:2px}

/* fields */
.lbl{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;min-width:0}
.fld{display:flex;align-items:center;gap:6px;border:1px solid var(--n200);border-radius:12px;background:#fff;min-height:48px;padding:0 12px}
.fld:focus-within{outline:2px solid var(--folha);outline-offset:1px;border-color:var(--folha)}
.fld input,.fld select{border:0;outline:0;flex:1;min-width:0;background:transparent;height:46px;font-weight:500;font-size:16px;padding:0}
.fld span{color:var(--t3);font-size:13px;font-weight:500;white-space:nowrap}
.calc{display:flex;align-items:center;gap:8px;border-radius:12px;background:var(--calc);min-height:48px;padding:0 12px;font-weight:700;font-size:16px}
.calc svg{flex:none;opacity:.55}.calc small{margin-left:auto;font-weight:500;color:var(--t3);font-size:13px}
.hint{font-size:12.5px;color:var(--t3);font-weight:400}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:14px;border:0;background:var(--folha);color:#fff;font-weight:700;font-size:15px;cursor:pointer}
.btn:hover{background:var(--folha-h)}
.btn.sec{background:var(--n100);color:var(--floresta)}.btn.sec:hover{background:var(--n200)}
.btn.danger{background:#fff;color:var(--barro);border:1px solid #E8C2BA}.btn.danger:hover{background:#FBEDEA}
.btn.sm{min-height:38px;padding:0 14px;font-size:14px;border-radius:12px}
.seg{display:flex;border-radius:14px;padding:4px;background:var(--n100);gap:2px}
.seg button{flex:1;border:0;border-radius:11px;min-height:42px;font-weight:600;font-size:14.5px;cursor:pointer;color:var(--t2);background:transparent;padding:0 12px}
.seg button[aria-selected=true]{background:#fff;color:var(--tinta);box-shadow:0 1px 3px rgba(13,51,36,.15)}
.alert{border-radius:12px;background:var(--palha-bg);border:1px solid var(--palha);padding:10px 14px;font-size:13.5px;color:#5C4500}
.note{border-radius:12px;background:var(--n100);padding:10px 14px;font-size:13.5px;color:var(--t2)}

/* lists/tables */
table{width:100%;border-collapse:collapse;font-size:14.5px}
th{text-align:right;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--t3);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--linha)}
td{text-align:right;padding:9px 10px;border-bottom:1px solid #EAF3E9}
th:first-child,td:first-child{text-align:left}
td.calc-c{background:var(--calc);font-weight:600}
tr.tot td{font-weight:700;border-bottom:0;background:var(--n50)}
.tag{display:inline-block;font-size:10.5px;font-weight:700;border-radius:999px;padding:5px 9px;letter-spacing:.04em;background:var(--n100);color:#134733}
.tag.v{background:var(--floresta);color:var(--pasto)}
.ops>div{display:flex;align-items:center;gap:12px;padding:13px 0;border-top:1px solid #EAF3E9}
.ops>div:first-child{border-top:0}
.ops .m{flex:1;min-width:0}.ops .m b{display:block;font-size:14.5px}.ops .m span{font-size:12.5px;color:var(--t3)}
.icon-b{border:0;background:transparent;width:40px;height:40px;border-radius:10px;cursor:pointer;color:var(--t2);display:inline-flex;align-items:center;justify-content:center}
.icon-b:hover{background:var(--n100)}
.empty{text-align:center;padding:44px 20px;color:var(--t2)}
.empty h3{font-size:22px;color:var(--tinta);margin:10px 0 6px}
.lotes-m{display:none}

/* cost bar */
.cbar{display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--n100)}
.legend{display:grid;gap:10px;margin-top:14px}
.legend div{display:flex;align-items:center;gap:10px;font-size:14.5px}
.legend i{width:12px;height:12px;border-radius:4px;flex:none}
.legend b{margin-left:auto}
.legend em{font-style:normal;color:var(--t3);width:52px;text-align:right;font-size:13px}

/* modal / toast */
.ov{position:fixed;inset:0;background:rgba(13,51,36,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:#fff;border-radius:24px;width:100%;max-width:640px;max-height:92vh;overflow:auto;padding:24px}
.modal h2{font-size:24px;margin-bottom:16px}
.row{display:grid;gap:14px;grid-template-columns:repeat(2,minmax(0,1fr))}
.stack{display:flex;flex-direction:column;gap:14px}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
#toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:var(--floresta);color:#fff;padding:12px 20px;border-radius:14px;font-weight:600;font-size:14.5px;z-index:80;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
textarea{width:100%;border:1px solid var(--n200);border-radius:12px;padding:12px;min-height:90px;font-size:15px;resize:vertical;background:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--n100);border-radius:999px;padding:4px 10px;font-size:13px;font-weight:600}

/* login */
.login{display:grid;grid-template-columns:1.1fr 1fr;min-height:100vh}
.login .l{background:var(--floresta);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.login .l:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(100deg,rgba(181,224,90,.07) 0 2px,transparent 2px 24px)}
.login .l>*{position:relative}
.login .l h2{font-size:44px;line-height:1.05;max-width:460px}
.login .r{display:flex;align-items:center;justify-content:center;padding:32px}
.login form{width:100%;max-width:400px;display:flex;flex-direction:column;gap:14px}
.login form h1{font-size:32px}

@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  aside{display:none}
  main{padding:18px 16px 110px}
  .top h1{font-size:28px}
  .big{font-size:36px}
  .g2,.g3,.g4,.row{grid-template-columns:1fr}
  .g4.keep2{grid-template-columns:repeat(2,minmax(0,1fr))}
  .bottom{display:flex;position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--linha);padding:8px 8px calc(10px + env(safe-area-inset-bottom));z-index:40}
  .bottom a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:48px;justify-content:center;font-size:11.5px;font-weight:600;color:var(--t3)}
  .bottom a span{width:56px;height:30px;border-radius:15px;display:flex;align-items:center;justify-content:center}
  .bottom a.on{color:#134733}.bottom a.on span{background:#CFE9D2}
  .tbl-d{display:none}.lotes-m{display:block}
  .login{grid-template-columns:1fr}.login .l{padding:28px;min-height:230px}.login .l h2{font-size:30px}
  .modal{padding:18px;border-radius:20px}
}
.cen-grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.cen{position:relative;display:flex;flex-direction:column;gap:12px;padding:18px 20px}
.cen.sel{border-color:var(--folha);box-shadow:0 0 0 2px var(--folha) inset}
.cen .nm{font-family:var(--disp);font-size:20px;font-weight:700;letter-spacing:-.02em;overflow-wrap:anywhere}
.cen .stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.cen .stats div{background:var(--calc);border-radius:10px;padding:8px 10px}
.cen .stats b{display:block;font-size:14px;margin-top:2px}
.chk{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;cursor:pointer;min-height:36px}
.chk input{width:18px;height:18px;accent-color:var(--folha)}
.cmp-wrap{overflow-x:auto}
.cmp th:not(:first-child),.cmp td:not(:first-child){min-width:150px}
.cmp td small{display:block;font-size:12px;font-weight:600;margin-top:2px}
.up{color:var(--folha)}.dn{color:var(--barro)}
.best{background:var(--calc);font-weight:700}
.tb{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.tb .fld{min-height:44px;flex:1;min-width:200px;max-width:380px}.tb .fld input{height:42px}
.tb select{border:1px solid var(--n200);background:#fff;border-radius:12px;min-height:44px;padding:0 12px;font-weight:600;font-size:14.5px}
.vt{display:flex;background:var(--n100);border-radius:12px;padding:3px}
.vt button{border:0;background:transparent;border-radius:9px;width:40px;height:38px;cursor:pointer;color:var(--t2);display:flex;align-items:center;justify-content:center}
.vt button[aria-pressed=true]{background:#fff;color:var(--tinta);box-shadow:0 1px 3px rgba(13,51,36,.15)}
.clist{background:#fff;border:1px solid var(--linha);border-radius:18px;overflow:hidden}
.crow{display:grid;grid-template-columns:30px minmax(150px,1.6fr) 110px 100px 90px 56px 64px 90px 140px;align-items:center;gap:10px;padding:8px 14px;border-top:1px solid #EAF3E9;min-height:56px}
.crow:first-child{border-top:0}
.crow.h .n{font-size:11px}.crow.h{min-height:40px;background:var(--n50);font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--t3)}
.crow:not(.h):hover{background:#FAFCF9}
.crow.sel{background:var(--calc)}
.crow .nm2{min-width:0}.crow .nm2 b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.crow .nm2 span{font-size:12.5px;color:var(--t3)}
.crow .n{text-align:right;font-size:14.5px}.crow .liq{text-align:right;font-weight:700;font-size:15px}
.crow .acts{display:flex;justify-content:flex-end;gap:0;white-space:nowrap}
.crow .acts .icon-b{width:34px;height:34px}
.crow input[type=checkbox],.gc input[type=checkbox]{width:18px;height:18px;accent-color:var(--folha);cursor:pointer}
.mb{height:8px;border-radius:4px;overflow:hidden;display:flex;background:var(--n100)}
.cgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.gc{background:#fff;border:1px solid var(--linha);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.gc.sel{border-color:var(--folha);box-shadow:0 0 0 2px var(--folha) inset}
.gc .t{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.gc .t b{font-family:var(--disp);font-size:16px;letter-spacing:-.02em;overflow-wrap:anywhere;line-height:1.15}
.gc .v{font-family:var(--disp);font-weight:700;font-size:22px;letter-spacing:-.03em}
.gc .f{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--t3)}
.cbar2{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--floresta);color:#fff;border-radius:16px;padding:10px 12px 10px 18px;display:flex;gap:12px;align-items:center;z-index:45;box-shadow:0 10px 30px rgba(13,51,36,.35);font-weight:600;font-size:14.5px;white-space:nowrap}
.cbar2 .btn{background:var(--pasto);color:var(--floresta);min-height:38px;padding:0 16px}
.cbar2 .lk{background:transparent;border:0;color:#CFE2CE;cursor:pointer;font-weight:600;padding:6px}
@media (max-width:900px){
  .strip .sv{font-size:19px}
  .strip{grid-template-columns:1fr 1fr}.strip>div:first-child{grid-column:1/-1;border-bottom:1px solid var(--linha)}.strip>div:nth-child(2){border-left:0}
  .crow{grid-template-columns:30px minmax(0,1fr) auto 76px;gap:8px;padding:10px 12px}
  .crow .hm{display:none}.crow.h{display:none}
  .crow .acts .hd{display:none}
  .crow .nm2 b{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .cbar2{bottom:84px;max-width:calc(100vw - 24px)}
}
.strip{display:grid;grid-template-columns:1.3fr 1fr 1fr;background:#fff;border:1px solid var(--linha);border-radius:16px;overflow:hidden}
.strip>div{padding:12px 18px}.strip>div+div{border-left:1px solid var(--linha)}
.strip .sv{font-family:var(--disp);font-weight:700;letter-spacing:-.03em;font-size:22px;margin-top:2px}
.strip .sv.neg{color:var(--barro)}.strip .sv.pos{color:var(--folha)}
.lrow{padding:10px 12px;border-top:1px solid #EAF3E9;display:flex;flex-direction:column;gap:2px}
.lrow:first-child{border-top:0}
.lrow .l1{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.lrow .l1 b{font-size:15px}.lrow .l1 span{font-weight:700;font-size:15px;white-space:nowrap}
.lrow .l2{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;color:var(--t3)}
.lrow .l2 .icon-b{width:34px;height:34px}
.lrow .l2>span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lrow .l2>span:last-child{flex:none;white-space:nowrap}
.strip .sv{white-space:nowrap}
.seg.g button[aria-selected=true]{background:var(--folha);color:#fff;box-shadow:0 1px 3px rgba(13,51,36,.25)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--palha);margin-left:6px;vertical-align:middle}
.pct{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--n200);border-radius:10px;background:#fff;padding:0 10px;min-height:38px}
.pct input{width:56px;border:0;outline:0;font-weight:600;font-size:15px;text-align:right;background:transparent}
.inf{display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;border-radius:50%;border:1.5px solid currentColor;background:transparent;color:inherit;opacity:.7;font:italic 700 11px/1 Georgia,serif;text-transform:none;letter-spacing:0;margin-left:6px;vertical-align:middle;cursor:pointer;padding:0;flex:none}
.inf:hover,.inf[aria-expanded=true]{opacity:1;box-shadow:0 0 0 3px rgba(31,122,79,.18)}
.inf>b{font:inherit}
.inf:focus-visible{outline:2px solid var(--folha);outline-offset:2px;opacity:1}
#pop{position:fixed;z-index:80;width:min(310px,calc(100vw - 24px));background:#fff;color:var(--tinta);border:1px solid var(--linha);border-radius:14px;box-shadow:0 12px 36px rgba(13,51,36,.22);padding:14px 16px 15px;font-size:13.5px;line-height:1.5;text-transform:none;letter-spacing:0;font-weight:400}
#pop[hidden]{display:none}
#pop h4{margin:0 0 4px;font-family:var(--disp);font-size:15px;letter-spacing:-.01em;font-weight:700}
#pop p{margin:0;color:var(--t2)}
#pop .fm{margin-top:10px;background:var(--calc);border-radius:10px;padding:8px 10px;font-weight:600;font-size:13px;color:var(--floresta)}
#pop .fm small{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--t3);margin-bottom:2px;font-weight:600}
.phero{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.avatar{width:72px;height:72px;border-radius:50%;background:var(--pasto);color:var(--floresta);display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:800;font-size:28px;letter-spacing:-.02em;flex:none;box-shadow:0 0 0 4px rgba(181,224,90,.25)}
.phero .who{min-width:0;flex:1}
.phero .who h2{font-size:26px;letter-spacing:-.03em;overflow-wrap:anywhere}
.phero .who p{margin:3px 0 0;color:#CFE2CE;font-size:14.5px;overflow-wrap:anywhere}
.chips2{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.c2{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:600;background:rgba(255,255,255,.1);color:#E4EFE3}
.c2 i{width:7px;height:7px;border-radius:50%;background:#8AA595}.c2.ok i{background:var(--pasto)}.c2.ok{color:#fff}
.btn.ghost{background:rgba(255,255,255,.12);color:#fff}.btn.ghost:hover{background:rgba(255,255,255,.2)}
.sec{display:grid;grid-template-columns:250px minmax(0,1fr);gap:32px;padding:28px 0;border-top:1px solid var(--linha)}
.sec:first-of-type{border-top:0}
.sec .hd{display:flex;gap:12px;align-items:flex-start}
.sec .hd .ico{width:38px;height:38px;border-radius:12px;background:var(--n100);color:var(--folha);display:flex;align-items:center;justify-content:center;flex:none}
.sec .hd h3{font-size:18px;letter-spacing:-.02em}

<script>
/* O Gado — motor de cálculo */
(function (g) {
  'use strict';

  // ---------- entrada / saída em pt-BR ----------
  function num(v) {
    if (typeof v === 'number') return isFinite(v) ? v : 0;
    if (v === null || v === undefined) return 0;
    var s = String(v).trim().replace(/[R$\s%]/g, '');
    if (s === '') return 0;
    if (s.indexOf(',') > -1) s = s.replace(/\./g, '').replace(',', '.');
    else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
    var n = parseFloat(s);
    return isFinite(n) ? n : 0;
  }
  function div(a, b) { return b ? a / b : 0; }
  function fmt(n, d) {
    d = d === undefined ? 2 : d;
    return Number(n).toLocaleString('pt-BR', { minimumFractionDigits: d, maximumFractionDigits: d });
  }
  function brl(n, d) { return 'R$ ' + fmt(n, d === undefined ? 2 : d); }

  // ---------- Compra e Venda ----------
  // Constantes de conversão
  var CV_PARAMS = { arrobaCompraKg: 30, arrobaVendaKg: 15, descontoVendaPct: 10 };

  // Peso do lote: informado (total), por cabeça (médio) ou animal a animal (individual).
  // No modo individual a quantidade é o nº de animais pesados e o peso é a soma deles.
  function pesoLote(r) {
    if (r.modo === 'individual') {
      var ps = (r.pesos || []).map(num).filter(function (x) { return x > 0; });
      return { qtd: ps.length, kg: ps.reduce(function (s, x) { return s + x; }, 0) };
    }
    var qtd = num(r.qtd), peso = num(r.peso);
    return { qtd: qtd, kg: r.modo === 'medio' ? qtd * peso : peso };
  }
  function compraLinha(r, p) {
    var pl = pesoLote(r), qtd = pl.qtd;
    var kg = pl.kg;
    var arr = kg / p.arrobaCompraKg;
    var total = arr * num(r.preco);
    return { qtd: qtd, kg: kg, arrobas: arr, preco: num(r.preco), total: total, porCab: div(total, qtd) };
  }
  function vendaLinha(r, p) {
    var pl = pesoLote(r), qtd = pl.qtd;
    var kg = pl.kg;
    var carcaca = r.base === 'carcaca';                       // padrão: peso vivo
    var pct = r.desconto === false ? 0 : (r.descontoPct === undefined || r.descontoPct === '' ? p.descontoVendaPct : num(r.descontoPct));
    var kgLiq = kg * (1 - pct / 100);                          // desconto percentual (opcional, p.ex. fêmeas)
    var arr = kgLiq / (carcaca ? p.arrobaVendaKg : p.arrobaCompraKg);
    var total = arr * num(r.preco);
    return { qtd: qtd, kg: kg, kgLiq: kgLiq, descPct: pct, arrobas: arr, preco: num(r.preco), total: total, porCab: div(total, qtd) };
  }
  function compraVenda(st, params) {
    var p = Object.assign({}, CV_PARAMS, params || {});
    var compras = (st.compras || []).map(function (r) { return compraLinha(r, p); });
    var vendas = (st.vendas || []).map(function (r) { return vendaLinha(r, p); });
    var sum = function (a, k) { return a.reduce(function (s, x) { return s + x[k]; }, 0); };
    var totalCompras = sum(compras, 'total');
    var totalVendas = sum(vendas, 'total');
    return {
      compras: compras, vendas: vendas,
      totalCompras: totalCompras, totalVendas: totalVendas,
      saldo: totalVendas - totalCompras,
      cabCompra: sum(compras, 'qtd'), cabVenda: sum(vendas, 'qtd'),
      arrCompra: sum(compras, 'arrobas'), arrVenda: sum(vendas, 'arrobas'),
      params: p
    };
  }

  // ---------- Recria ----------
  var RECRIA_DEFAULTS = {
    area: 102,
    dias: 270,
    investimento: 122534.8,
    rsCabCompra: 2050,
    pesoIni: 188,
    pesoFin: 420,
    precoVenda: 325,
    consumoPct: 0.003,
    precoSuplKg: 2,
    rendCarcaca: 0.52,
    imposto: 0.015,
    sanidadeCabMes: 2.5,
    funcionario: 9000,
    frete: 3000,
    areaLotacaoInicial: 'fixa80'
  };
  var UA_KG = 450, ARROBA_VIVO = 30, ARROBA_CARCACA = 15;

  function recria(raw) {
    var i = {};
    Object.keys(RECRIA_DEFAULTS).forEach(function (k) {
      i[k] = k === 'areaLotacaoInicial' ? (raw[k] || RECRIA_DEFAULTS[k]) : num(raw[k]);
    });
    var o = {};
    o.cabecas = div(i.investimento, i.rsCabCompra);
    o.lotacaoTotalUA = o.cabecas * i.pesoIni / UA_KG;
    o.lotacaoHaInicial = div(o.lotacaoTotalUA, i.areaLotacaoInicial === 'area' ? i.area : 80);
    o.pesoMedio = (i.pesoIni + i.pesoFin) / 2;
    o.lotacaoFinal = div(o.cabecas * o.pesoMedio / UA_KG, i.area);
    o.arrobasProduzidas = i.pesoFin / ARROBA_VIVO * o.cabecas;
    // Suplemento
    o.consumoKgDia = o.pesoMedio * i.consumoPct;
    o.suplCabDia = o.consumoKgDia * i.precoSuplKg;
    o.suplDia = o.suplCabDia * o.cabecas;
    o.suplTotal = o.suplDia * i.dias;
    // Imposto
    o.arrobasCarcacaCab = i.pesoFin * i.rendCarcaca / ARROBA_CARCACA;
    o.vendaCab = o.arrobasCarcacaCab * i.precoVenda;
    o.impostoCab = o.vendaCab * i.imposto;
    o.impostoTotal = o.impostoCab * o.cabecas;
    // Sanidade
    o.sanidadeTotal = i.dias / 30 * o.cabecas * i.sanidadeCabMes;
    // Custo operacional
    o.custos = [
      { id: 'supl', nome: 'Suplemento', valor: o.suplTotal },
      { id: 'san', nome: 'Sanidade', valor: o.sanidadeTotal },
      { id: 'imp', nome: 'Imposto', valor: o.impostoTotal },
      { id: 'frete', nome: 'Transporte (frete)', valor: i.frete },
      { id: 'func', nome: 'Funcionário', valor: i.funcionario }
    ];
    o.custoTotal = o.custos.reduce(function (s, c) { return s + c.valor; }, 0);
    o.faturamentoBruto = o.arrobasProduzidas * i.precoVenda;
    o.faturamentoLiquido = o.faturamentoBruto - o.custoTotal - i.investimento;
    o.totalEmCaixa = i.investimento + o.faturamentoLiquido;
    o.liquidoMes = div(o.faturamentoLiquido, i.dias / 30);
    o.liquidoHa = div(o.faturamentoLiquido, i.area);
    // Ganho médio diário implícito
    o.gmdImplicito = div(i.pesoFin - i.pesoIni, i.dias);
    o.inputs = i;
    return o;
  }

  var api = {
    num: num, fmt: fmt, brl: brl, div: div,
    compraVenda: compraVenda, recria: recria,
    CV_PARAMS: CV_PARAMS, RECRIA_DEFAULTS: RECRIA_DEFAULTS
  };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  g.OGado = api;
})(typeof window !== 'undefined' ? window : globalThis);

</script>

  var perfil = '<div class="panel"><div class="bd"><div class="r2">' + fld('pf-nome', 'Nome', u.nome, 'text', 'autocomplete="name"') + fld('pf-email', 'E-mail', u.email, 'email', 'autocomplete="email"') + '</div></div><div class="ft"><span class="hint">Usado no login e nas mensagens do sistema.</span><button class="btn sm" data-act="save-perfil">Salvar dados</button></div></div>';
  var senha = '<div class="panel"><div class="bd">' + (u.pw ? fld('pw-atual', 'Senha atual', '', 'password', 'autocomplete="current-password"') : '<div class="note">Você ainda não tem uma senha. Defina uma para entrar sem a conta Google.</div>') +
    '<div class="r2">' + fld('pw-nova', 'Nova senha', '', 'password', 'autocomplete="new-password" placeholder="Mínimo de 8 caracteres"') + fld('pw-conf', 'Confirmar nova senha', '', 'password', 'autocomplete="new-password"') + '</div></div><div class="ft"><span class="hint">Use letras, números e símbolos para uma senha forte.</span><button class="btn sm" data-act="save-pw">' + (u.pw ? 'Alterar senha' : 'Definir senha') + '</button></div></div>';
  var google = '<div class="panel"><div class="bd"><div class="rowi"><span class="gmark">G</span><div style="min-width:0;flex:1"><b style="display:block">Google</b><span class="hint" style="overflow-wrap:anywhere">' + (G ? esc(G) : 'Entre mais rápido, sem digitar senha.') + '</span></div><span class="sp' + (G ? ' ok' : '') + '"><i></i>' + (G ? 'Vinculada' : 'Não vinculada') + '</span></div></div>' +
    '<div class="ft"><span class="hint">' + (G ? 'Você pode usar “Entrar com Google” na tela de acesso.' : 'Você poderá usar “Entrar com Google”.') + '</span>' + (G ? '<button class="btn sec sm" data-act="google-unlink">Desvincular</button>' : '<button class="btn sm" data-act="google-link">Vincular conta Google</button>') + '</div></div>';
  var faz = '<div class="panel"><div class="bd"><div class="r2"><label class="lbl">Nome da fazenda<div class="fld"><input id="cf-nome" value="' + esc(st.fazenda.nome) + '"></div></label><label class="lbl">Área pastável<div class="fld"><input id="cf-area" inputmode="decimal" value="' + (st.fazenda.area > 0 ? esc(nice(st.fazenda.area)) : '') + '"><span>ha</span></div></label></div></div><div class="ft"><span class="hint">A área é usada nos cálculos de lotação e de resultado por hectare.</span><button class="btn sm" data-act="save-faz">Salvar</button></div></div>';
  var perigo = '<div class="panel danger"><div class="bd"><div><b>Apagar minha conta</b><p style="margin:4px 0 0;color:var(--t2);font-size:14px;line-height:1.5">Seus dados, a fazenda, os lotes e os cenários serão removidos de forma permanente.</p></div></div><div class="ft"><span class="hint">Você precisará escrever “deletar” para confirmar.</span><button class="btn danger sm" data-act="del-conta">Apagar conta</button></div></div>';
  var body = hero + '<div style="margin-top:6px">' +
    sec('user', 'Perfil', 'Seu nome e o e-mail de acesso.', perfil) +
    sec('lock', 'Senha', 'Mantenha sua conta protegida com uma senha só sua.', senha) +
    sec('swap', 'Conta Google', 'Vincule para entrar com um toque.', google) +
    sec('home', 'Fazenda', 'Dados usados nos seus cálculos.', faz) +
    sec('trash', 'Zona de perigo', 'Ações sem volta.', perigo, 'dg') + '</div>';
  app.innerHTML = shell('conta', 'Conta', 'Gerencie seus dados, acesso e fazenda.', '', body);
}
function delConta() {
  var ov = document.createElement('div'); ov.className = 'ov'; ov.id = 'ov2'; ov.style.zIndex = 70;
  ov.innerHTML = '<div class="modal" role="alertdialog" aria-modal="true" aria-labelledby="dt" style="max-width:480px"><h2 id="dt" style="color:var(--barro)">Apagar sua conta?</h2>' +
    '<p style="color:var(--t2);margin:0 0 10px;line-height:1.5">Esta ação é <b>permanente</b>. Serão apagados seu perfil, a fazenda, todos os lotes de compra e venda e todos os cenários.</p>' +
    '<label class="lbl">Para confirmar, escreva <b>deletar</b><div class="fld"><input id="del-in" autocomplete="off"></div></label>' +
    '<div class="actions"><button class="btn sec" data-act="c-cancel">Cancelar</button><button class="btn danger" id="del-ok" data-act="del-ok" disabled style="opacity:.5">Apagar conta</button></div></div>';
  document.body.appendChild(ov); document.getElementById('del-in').focus();
}
/* ---------- render ---------- */
function render() {
  var r = route();
  if (!st.logged && r !== 'entrar') { go('entrar'); return; }
  if (st.logged && r === 'entrar') { go('painel'); return; }
  if (r === 'entrar') viewLogin(); else if (r === 'painel') viewPainel(); else if (r === 'negocios') viewNegocios(); else if (r === 'recria') viewRecria(); else viewConta();
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', function () { closeModal(); render(); });

/* ---------- eventos ---------- */
document.addEventListener('click', function (e) {
  var t = e.target.closest('[data-act],[data-tab],[data-modo],[data-new],[data-rtab],[data-cview],[data-base],[data-tsw]'); if (!t) return;
  if (t.dataset.base && draft) { draft.base = t.dataset.base; drawLote(); return; }
  if (t.dataset.tsw && draft) { draft._tipo = t.dataset.tsw; var L2 = draft._tipo === 'compra' ? st.compras : st.vendas; draft.lote = nextLote(L2); if (draft.categoria === 'BEZERROS' || draft.categoria === 'BOIS') draft.categoria = draft._tipo === 'compra' ? 'BEZERROS' : 'BOIS'; if (!draft._descTouched) draft.desconto = isFemea(draft.categoria); drawLote(); return; }
  if (t.dataset.cview) { cview = t.dataset.cview; viewRecria(); return; }
  if (t.dataset.rtab) { rtab = t.dataset.rtab; viewRecria(); window.scrollTo(0, 0); return; }
  if (t.dataset.tab) { tab = t.dataset.tab; viewNegocios(); return; }
  if (t.dataset.modo && draft) { draft.modo = t.dataset.modo; drawLote(); return; }
  if (t.dataset.new && !t.dataset.act) { tab = 'todas'; setTimeout(function () { openLote(t.dataset.new); }, 30); return; }
  var a = t.dataset.act, id = t.dataset.id;
  if (a === 'entrar') { st.user.email = st.user.email || st.user.google || 'visitante@gmail.com'; entrar(); }
  else if (a === 'new') openLote(tab === 'vendas' ? 'venda' : 'compra');
  else if (a === 'edit') openLote(t.dataset.tipo || 'compra', id);
  else if (a === 'del') delLote(id, t.dataset.tipo || 'compra');
  else if (a === 'save-perfil') {
    var nm = document.getElementById('pf-nome').value.trim(), em = document.getElementById('pf-email').value.trim();
    if (!nm) { toast('Informe seu nome.'); return; } if (!okEmail(em)) { toast('Informe um e-mail válido.'); return; }
    confirmar({ titulo: 'Salvar alterações?', texto: 'Seu nome e e-mail serão atualizados.', ok: 'Salvar', cb: function () { st.user.nome = nm; st.user.email = em; save(); viewConta(); toast('Dados atualizados.'); } });
  }
  else if (a === 'save-pw') {
    var at = document.getElementById('pw-atual'), nv = document.getElementById('pw-nova').value, cf = document.getElementById('pw-conf').value;
    if (st.user.pw && enc(at.value) !== st.user.pw) { toast('A senha atual está incorreta.'); return; }
    if (nv.length < 8) { toast('A nova senha precisa ter pelo menos 8 caracteres.'); return; }
    if (nv !== cf) { toast('A confirmação não confere com a nova senha.'); return; }
    confirmar({ titulo: st.user.pw ? 'Alterar senha?' : 'Definir senha?', texto: 'Use a nova senha no próximo acesso.', ok: 'Confirmar', cb: function () { st.user.pw = enc(nv); save(); viewConta(); toast('Senha atualizada.'); } });
  }
  else if (a === 'google-link') openNome('Vincular conta Google', st.user.email || '', function (v) { if (!okEmail(v)) { toast('Informe um e-mail válido.'); return; } st.user.google = v; save(); viewConta(); toast('Conta Google vinculada.'); }, 'E-mail da conta Google', 'voce@gmail.com', 'Vincular');
  else if (a === 'google-unlink') {
    if (!st.user.pw) { toast('Defina uma senha antes de desvincular, para não perder o acesso.'); return; }
    confirmar({ titulo: 'Desvincular conta Google?', texto: 'Você continuará entrando com e-mail e senha.', ok: 'Desvincular', danger: true, cb: function () { delete st.user.google; save(); viewConta(); toast('Conta Google desvinculada.'); } });
  }
  else if (a === 'del-conta') delConta();
  else if (a === 'del-ok') { var dv = document.getElementById('del-in'); if (dv && dv.value.trim().toLowerCase() === 'deletar') { closeConfirm(); try { localStorage.removeItem(KEY); } catch (e) {} st = seed(); go('entrar'); render(); toast('Conta apagada.'); } }
  else if (a === 'c-cancel') closeConfirm();
  else if (a === 'c-ok') { var cb = confirmCb; closeConfirm(); if (cb) cb(); }
  else if (a === 'cancel') closeModal();
  else if (a === 'save-lote') saveLote();
  else if (a === 'open-save-cen') openNome('Salvar como cenário', 'Cenário ' + (st.cenarios.length + 1), function (n) { st.cenarios.unshift({ id: uid(), nome: n || 'Cenário ' + (st.cenarios.length + 1), data: new Date().toLocaleDateString('pt-BR'), v: Object.assign({}, st.recria) }); save(); rtab = 'cen'; viewRecria(); toast('Cenário salvo.'); });
  else if (a === 'nome-ok') nomeOk();
  else if (a === 'cmp-open') { cmpOpen = true; drawCen(); var el = document.getElementById('cen-cmp'); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
  else if (a === 'cmp-close') { cmpOpen = false; drawCen(); }
  else if (a === 'cmp-clear') { cmp = []; cmpOpen = false; drawCen(); }
  else if (a === 'load-cen') { var c = st.cenarios.filter(function (x) { return x.id === id; })[0]; if (c) { st.recria = Object.assign({}, c.v); save(); rtab = 'sim'; viewRecria(); window.scrollTo(0, 0); toast('Cenário "' + c.nome + '" aberto no simulador.'); } }
  else if (a === 'dup-cen') { var d0 = st.cenarios.filter(function (x) { return x.id === id; })[0]; if (d0) { st.cenarios.splice(st.cenarios.indexOf(d0), 0, { id: uid(), nome: d0.nome + ' (cópia)', data: new Date().toLocaleDateString('pt-BR'), v: Object.assign({}, d0.v) }); save(); viewRecria(); toast('Cenário duplicado.'); } }
  else if (a === 'ren-cen') { var r0 = st.cenarios.filter(function (x) { return x.id === id; })[0]; if (r0) openNome('Renomear cenário', r0.nome, function (n) { if (n) { r0.nome = n; save(); viewRecria(); } }); }
  else if (a === 'del-cen') { var x0 = st.cenarios.filter(function (x) { return x.id === id; })[0]; if (x0) confirmar({ titulo: 'Excluir cenário?', texto: '“' + x0.nome + '” será removido. Esta ação não pode ser desfeita.', ok: 'Excluir', danger: true, cb: function () { st.cenarios = st.cenarios.filter(function (x) { return x.id !== id; }); cmp = cmp.filter(function (k) { return k !== id; }); save(); viewRecria(); toast('Cenário excluído.'); } }); }
  else if (a === 'save-faz') confirmar({ titulo: 'Salvar alterações?', texto: 'Os dados da fazenda serão atualizados.', ok: 'Salvar', cb: function () { st.fazenda.nome = document.getElementById('cf-nome').value.trim(); st.fazenda.area = N(document.getElementById('cf-area').value) || 0; st.recria.area = st.fazenda.area > 0 ? nice(st.fazenda.area) : ''; save(); viewConta(); toast('Fazenda atualizada.'); } });
  else if (a === 'logout') { st.logged = false; save(); go('entrar'); }
});
document.addEventListener('input', function (e) {
  var t = e.target;
  if (t.id === 'del-in') { var ok = t.value.trim().toLowerCase() === 'deletar', bt = document.getElementById('del-ok'); if (bt) { bt.disabled = !ok; bt.style.opacity = ok ? 1 : .5; } return; }
  if (t.id === 'cen-q') { cq = t.value; drawCen(); return; }
  if (t.dataset && t.dataset.k) { st.recria[t.dataset.k] = t.value; save(); drawRes(); return; }
  if (!draft) return;
  if (t.id === 'd-qtd') draft.qtd = t.value; else if (t.id === 'd-peso') { if (draft.modo === 'medio') draft.pesoM = t.value; else draft.pesoT = t.value; } else if (t.id === 'd-preco') draft.preco = t.value;
  else if (t.id === 'd-pct') draft.descontoPct = t.value; else if (t.id === 'd-pesos') draft._txt = t.value; else if (t.id === 'd-cat') { draft.categoria = t.value; if (!draft._descTouched) { draft.desconto = isFemea(t.value); var cb = document.getElementById('d-desc'); if (cb) cb.checked = draft.desconto; } } else if (t.id === 'd-data') draft.data = t.value; else return;
  prevLote();
});
document.addEventListener('change', function (e) {
  if (e.target.id === 'd-desc' && draft) { draft.desconto = e.target.checked; draft._descTouched = true; var pi = document.getElementById('d-pct'); if (pi) pi.disabled = !draft.desconto; prevLote(); return; }
  if (e.target.dataset && e.target.dataset.cmp) { var id = e.target.dataset.cmp, k = cmp.indexOf(id); if (k > -1) cmp.splice(k, 1); else { if (cmp.length >= 3) { e.target.checked = false; toast('Compare até 3 cenários.'); return; } cmp.push(id); } if (cmp.length < 2) cmpOpen = false; drawCen(); return; }
  if (e.target.id === 'cen-sort') { csort = e.target.value; drawCen(); return; }
  if (e.target.id === 'r-area') { st.recria.areaLotacaoInicial = e.target.value; save(); drawRes(); } });
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { if (document.getElementById('ov2')) closeConfirm(); else closeModal(); } });
window.addEventListener('resize', function () { /* layouts mudam por CSS; grids inline reavaliados na próxima navegação */ });

render();
})();
</script>
</body>
</html>
