name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ogado
          POSTGRES_PASSWORD: ogado_ci
          POSTGRES_DB: ogado
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ogado -d ogado"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ogado:ogado_ci@localhost:5432/ogado?schema=public
      NEXT_PUBLIC_API_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm --filter @ogado/domain test:coverage
      - run: pnpm test:parity
      - run: node scripts/validate-routing.mjs
      - run: node scripts/trace-check.mjs
      - run: pnpm build
