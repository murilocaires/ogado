name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ogado
          POSTGRES_PASSWORD: ogado_ci
          POSTGRES_DB: ogado_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ogado -d ogado_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ogado:ogado_ci@localhost:5432/ogado_test?schema=public
      TEST_DATABASE_URL: postgresql://ogado:ogado_ci@localhost:5432/ogado_test?schema=public
      NEXT_PUBLIC_API_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm --filter @bovaro/domain test:coverage
      - run: pnpm test:parity
      - run: pnpm performance:check
      - run: node scripts/validate-routing.mjs
      - run: node scripts/trace-check.mjs --strict
      - run: pnpm build
      - run: pnpm audit --audit-level=moderate

  browser:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ogado
          POSTGRES_PASSWORD: ogado_ci
          POSTGRES_DB: ogado_browser_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ogado -d ogado_browser_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ogado:ogado_ci@localhost:5432/ogado_browser_test?schema=public
      TEST_DATABASE_URL: postgresql://ogado:ogado_ci@localhost:5432/ogado_browser_test?schema=public
      E2E_CHANNEL: ''
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm --filter @bovaro/db exec prisma migrate deploy
      - run: pnpm --filter @bovaro/web exec playwright install --with-deps chromium
      - run: pnpm --filter @bovaro/web test:e2e:rebrand
      - run: pnpm --filter @bovaro/web test:e2e:local
        env:
          E2E_LOCAL_BUILD: '1'
      - run: pnpm --filter @bovaro/web test:e2e
      - run: pnpm --filter @bovaro/web test:e2e:offline
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          retention-days: 7
